modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "The Simulated Team / The Creators of Aeronautics (original), Ported to MC 26.3 + Sable 26.3"
credits = "Ported from Simulated-Project Creative Physics Staff (MIT code) with original assets and vanilla sound adaptation."
description = '''Standalone Creative Physics Staff extracted and ported to Minecraft ${minecraft_version} / NeoForge, powered by the Sable 26.3 port. Drag, rotate, adjust distance, and lock physics sub-levels up to 128 blocks away.'''
logoBlur = false

[[mixins]]
config = "physics_staff.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sable"
type = "required"
versionRange = "${sable_version_range}"
ordering = "AFTER"
side = "BOTH"
